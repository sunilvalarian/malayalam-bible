<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script>
  // same theme as the reader (Aa → theme), applied before first paint
  (function () {
    var t = 'light';
    try { t = (JSON.parse(localStorage.getItem('mlb.settings') || '{}').theme) || 'light'; } catch (e) { /* default */ }
    document.documentElement.dataset.theme = t;
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelector('meta[name="theme-color"]').content = dark ? '#121212' : t === 'sepia' ? '#f4ecd8' : '#fbfaf7';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      <button value="ok" class="btn primary" id="confirmOk">ശരി</button>

</dialog>
